<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>彈珠賽場 Marble Derby</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="tags"></div>
  <div id="fps" class="hidden"></div>

  <div id="hud" class="hidden">
    <div id="mini">
      <canvas id="miniMap"></canvas>
      <div id="myBets"></div>
    </div>
    <ol id="board"></ol>
    <div id="msg"></div>
    <div id="sub"></div>
    <div id="ctrl">
      <button id="btnFocus">👁 跟隨</button>
      <button id="btnCam">📷 鏡頭</button>
      <button id="btnSpeed">⏩ 1x</button>
      <button class="gear" title="調整">⚙</button>
      <button id="btnNext" class="hidden">下一場 ▶</button>
    </div>
  </div>

  <div id="bet" class="panel wide hidden">
    <div class="betHead">
      <div><b id="raceNo"></b><span class="dim">　選彈珠下注，再按開賽</span></div>
      <div class="coins">💰 <span id="coins"></span><button class="gear" title="調整">⚙</button></div>
    </div>
    <div id="bankrupt" class="hidden">錢輸光了！送你 1000 救濟金，再來一次 🍀</div>
    <div class="row">
      <span>籌碼</span>
      <div id="chips"></div>
    </div>
    <div class="legend dim"><b>獨贏</b>＝跑第 1 名　<b>前三</b>＝跑進前 3 名　賠率含本金</div>
    <div id="field"></div>
    <div class="betFoot">
      <div>已下注 <b id="staked">0</b></div>
      <button id="clearBtn">清除</button>
      <button id="goBtn" class="big">開賽！</button>
    </div>
  </div>

  <div id="result" class="panel hidden">
    <h1 id="resTitle"></h1>
    <ol id="podium"></ol>
    <div id="payout"></div>
    <button id="nextBtn" class="big">下一場</button>
    <button id="watchBtn">繼續觀看</button>
  </div>

  <div id="tune" class="panel hidden">
    <div class="tuneHead"><b>⚙ 調整</b><button id="tuneClose" title="關閉">✕</button></div>
    <div class="tuneItem">
      <div class="tuneTop"><span>彈珠速度</span><b id="baseVal"></b></div>
      <input id="baseRange" type="range" min="0.5" max="4" step="0.1" />
      <div class="dim">調整 1x 實際有多快，2x、3x、5x、10x 會跟著一起變。</div>
    </div>
    <div class="tuneItem">
      <div class="tuneTop"><span>彈珠碰撞力</span><b id="restVal"></b></div>
      <input id="restRange" type="range" min="0.1" max="1" step="0.05" />
      <div class="dim">彈珠互撞後彈開的幅度，越大越彈。調低時撞到賽道、釘子等也會比較不彈。</div>
    </div>
    <div class="tuneItem">
      <div class="tuneTop"><span>音量</span><b id="volVal"></b></div>
      <input id="volRange" type="range" min="0" max="1" step="0.05" />
      <div class="dim">所有音效的大小，拉到最左邊就是靜音。</div>
    </div>
    <button id="tuneReset">恢復預設</button>
  </div>

  <div id="loading">載入中…</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
