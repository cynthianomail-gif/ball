<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>彈珠大逃殺 Marble Rush</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="rankBox"><div id="rank">-</div><div id="alive"></div></div>
    <div id="progressWrap">
      <div id="cpInfo"></div>
      <div id="progress"><div id="dots"></div></div>
    </div>
    <ol id="board"></ol>
    <div id="abilities"></div>
    <div id="msg"></div>
    <div id="sub"></div>
  </div>

  <div id="cards" class="hidden">
    <div class="cardsTitle">晉級！選一張升級卡 <span id="cardTimer"></span></div>
    <div id="cardList"></div>
  </div>

  <div id="touch" class="hidden">
    <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
    <button id="btnJump">跳</button>
    <button id="btnDash">衝</button>
    <button id="btnCam">📷</button>
    <button id="btnRespawn">↺</button>
  </div>

  <div id="menu" class="panel">
    <h1>彈珠大逃殺</h1>
    <p class="tag">在巨大的臥室裡，和一大群彈珠一起衝下積木賽道。<br>每過一個檢查點，最後面的彈珠就會被淘汰！</p>
    <div class="row"><span>你的彈珠顏色</span><div id="colors"></div></div>
    <div class="row"><span>彈珠數量</span>
      <select id="count"><option value="50">50 顆（標準）</option><option value="30">30 顆</option><option value="20">20 顆（手機省電）</option></select>
    </div>
    <div class="row"><span>難度</span>
      <select id="diff"><option value="0">簡單</option><option value="1" selected>普通</option><option value="2">困難</option></select>
    </div>
    <button id="startBtn" class="big">開始比賽</button>
    <div class="help">
      <div><b>W A S D / 方向鍵</b> 移動</div>
      <div><b>空白鍵</b> 跳躍　<b>Shift / E</b> 衝刺</div>
      <div><b>C</b> 切換鏡頭　<b>R</b> 回到賽道　<b>拖曳滑鼠</b> 轉視角</div>
      <div><b>1 2 3</b> 選升級卡</div>
    </div>
  </div>

  <div id="result" class="panel hidden">
    <h1 id="resTitle"></h1>
    <p id="resText"></p>
    <button id="againBtn" class="big">再玩一次</button>
    <button id="watchBtn">繼續觀戰</button>
  </div>

  <div id="loading">載入中…</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
