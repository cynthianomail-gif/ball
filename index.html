<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>彈珠賽場 Marble Derby</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="tags"></div>

  <div id="hud" class="hidden">
    <div id="myBets"></div>
    <div id="progressWrap">
      <div id="cpInfo"></div>
      <div id="progress"><div id="dots"></div></div>
    </div>
    <ol id="board"></ol>
    <div id="msg"></div>
    <div id="sub"></div>
    <div id="ctrl">
      <button id="btnFocus">👁 跟隨</button>
      <button id="btnCam">📷 鏡頭</button>
      <button id="btnSpeed">⏩ 1x</button>
      <button id="btnNext" class="hidden">下一場 ▶</button>
    </div>
  </div>

  <div id="bet" class="panel wide hidden">
    <div class="betHead">
      <div><b id="raceNo"></b><span class="dim">　選彈珠下注，再按開賽</span></div>
      <div class="coins">💰 <span id="coins"></span></div>
    </div>
    <div id="bankrupt" class="hidden">錢輸光了！送你 1000 救濟金，再來一次 🍀</div>
    <div class="row">
      <span>籌碼</span>
      <div id="chips"></div>
    </div>
    <div class="legend dim">★ 實力　<b>獨贏</b>＝跑第 1 名　<b>前三</b>＝跑進前 3 名　賠率含本金</div>
    <div id="field"></div>
    <div class="betFoot">
      <div>已下注 <b id="staked">0</b></div>
      <button id="clearBtn">清除</button>
      <button id="goBtn" class="big">開賽！</button>
    </div>
  </div>

  <div id="result" class="panel hidden">
    <h1 id="resTitle"></h1>
    <ol id="podium"></ol>
    <div id="payout"></div>
    <button id="nextBtn" class="big">下一場</button>
    <button id="watchBtn">繼續觀看</button>
  </div>

  <div id="loading">載入中…</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
